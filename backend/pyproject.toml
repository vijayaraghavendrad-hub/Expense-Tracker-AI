[project]
name = "smart-expense-tracker-backend"
version = "0.1.0"
description = "FastAPI and ML Backend for Smart Expense Tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "psycopg2-binary>=2.9.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

