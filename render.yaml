services:
  - type: web
    name: smart-expense-tracker-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-expense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://expense-tracker-89tytt5s0-freak-finds.vercel.app,http://localhost:5173
      - key: ENABLE_AUTO_SHUTDOWN
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: smart-expense-db
    plan: free
    databaseName: smart_expense_tracker
    user: smart_app
