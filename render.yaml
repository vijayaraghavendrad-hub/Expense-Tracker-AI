services:
  - type: web
    name: smart-expense-tracker-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard → Environment → from your Supabase connection string
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://expense-tracker-89tytt5s0-freak-finds.vercel.app,https://expense-tracker-freak-finds.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: ENABLE_AUTO_SHUTDOWN
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11"
